# The release build, started by release.js's tag push. release.js has created the GitHub release as a draft; this
# builds every target, attests the assets, attaches them to the draft and only then publishes it, so the release is
# complete at publication and can be an immutable release (repository setting: tags and assets can't change after
# publishing, and GitHub adds a release attestation). Then it verifies the published release, and stages npm.
name: release
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # attach the assets, publish the draft
      id-token: write          # OIDC token for the Sigstore signing certificate
      attestations: write      # store the attestations
      artifact-metadata: write # the artifact storage records
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: draft release
        run: |
          gh release view "$TAG" --json isDraft --jq 'if .isDraft then "draft \(env.TAG) found" else error("release \(env.TAG) is already published") end'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ts-sema-*
          merge-multiple: true

      - name: checksums
        run: |
          sha256sum ts-sema-*.tar.gz ts-sema-*.cdx.json > SHA256SUMS
          cat SHA256SUMS

      # SLSA build provenance for every asset (the packages, their -debug packages and SBOMs), signed with this run's
      # identity, stored by GitHub and in the Sigstore transparency log. The bundle is also attached to the release
      # (ts-sema-<version>.sigstore.json), where tools like OpenSSF Scorecard look for signatures.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-path: 'ts-sema-*.tar.gz, ts-sema-*.cdx.json, SHA256SUMS'

      - name: attach and publish
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "ts-sema-$TAG.sigstore.json"
          gh release upload "$TAG" ts-sema-*.tar.gz ts-sema-*.cdx.json SHA256SUMS "ts-sema-$TAG.sigstore.json"
          gh release edit "$TAG" --draft=false

  # The published release, checked the way a user would: immutable with GitHub's release attestation (when the
  # repository has immutable releases on; else this step fails), every asset matching the release and SHA256SUMS,
  # and every asset's build provenance from this workflow at this tag.
  verify:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: verify
        run: |
          gh release download "$TAG" --dir assets
          cd assets
          sha256sum -c SHA256SUMS
          gh release verify "$TAG"
          for f in ts-sema-*.tar.gz ts-sema-*.cdx.json SHA256SUMS; do
            gh release verify-asset "$TAG" "$f"
            gh attestation verify "$f" --repo "$GH_REPO" --source-ref "refs/tags/$TAG" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" --deny-self-hosted-runners
          done

  # The npm packages, from the verified release's assets (npm.js checks them against SHA256SUMS), **staged** with npm
  # trusted publishing: no npm token (npm checks this workflow's OIDC identity), a provenance attestation per package,
  # and nothing public until a maintainer approves each staged version with 2FA (npmjs.com, or npm stage list +
  # npm stage approve <id>). Needs a trusted publisher (GitHub Actions, just-js/ts-sema, release.yml, "allow npm
  # publish" off) on each of the six packages, npm 11.15.0+ and Node 22.14+. A prerelease goes to "next".
  npm:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write          # OIDC token for npm trusted publishing (and provenance)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm (11.15.0+ for staged publishing), publint and attw, pinned by hash in .github/npm/package-lock.json;
      # npm.js uses them from .github/npm/node_modules.
      - name: release tools
        run: |
          npm ci --prefix .github/npm --ignore-scripts --no-audit --no-fund
          .github/npm/node_modules/.bin/npm --version

      # npm.js writes the six packages to dist/npm/ from the verified release assets, and lints them (publint, attw):
      # any finding stops the job before anything is staged.
      - name: packages
        run: |
          node npm.js "${{ github.ref_name }}" --lint

      # npm stage publish in each package, in dist/npm/order.json's order (platform packages first, the main one
      # last), with provenance; a prerelease goes to "next". Trusted publishing: npm uses this job's OIDC identity.
      - name: npm stage publish
        env:
          DIST_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
        run: |
          for dir in $(node -p "require('./dist/npm/order.json').join(' ')"); do
            echo "npm stage publish dist/npm/$dir"
            (cd "dist/npm/$dir" && "$GITHUB_WORKSPACE/.github/npm/node_modules/.bin/npm" stage publish \
              --access public --provenance --tag "$DIST_TAG")
          done
