# CodeQL code scanning ("advanced setup": this file). Leave GitHub's "default setup" off in Settings -> Code security,
# or GitHub rejects this workflow's results. Our code: the Node scripts and bindings (javascript-typescript), the
# addon and test C (c-cpp), capi/ (rust), and the workflows themselves (actions); nothing is built (build-mode none).
# Results go to the Security tab; Scorecard's SAST check counts them.
name: codeql
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '35 9 * * 1' # weekly, Mondays

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload the results
    strategy:
      fail-fast: false
      matrix:
        language: [actions, c-cpp, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
