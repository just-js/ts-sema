name: build ts-sema (reusable)
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl targets build natively in Alpine, with `docker run` for the build step only (as lo's musl jobs do):
          # JavaScript actions (checkout, upload, attest) don't run inside Alpine containers on arm64. The smoke test
          # links with the build host's libzstd, so it runs where the target is the host's own.
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-24.04
            cc: gcc
            test: true
          - target: x86_64-unknown-linux-musl
            runs-on: ubuntu-24.04
            alpine: true
            test: true
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
            cc: gcc
            test: true
          - target: aarch64-unknown-linux-musl
            runs-on: ubuntu-24.04-arm
            alpine: true
            test: true
          - target: aarch64-apple-darwin
            runs-on: macos-15
            cc: clang
            test: true
          # Intel macOS, cross-built on Apple silicon (as lo's mac-x64 build is). No test, shared library or addon:
          # Homebrew's libzstd there is arm64 only, so nothing x86_64 can be linked (the static archive is fine).
          - target: x86_64-apple-darwin
            runs-on: macos-15
            cc: clang
            cflags: -arch x86_64
            no-shared: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Bun's pinned nightly (vendor/bun/rust-toolchain.toml, recorded in upstream.json).
      # SOURCE_DATE_EPOCH: the commit's time, for the SBOM's timestamp (sbom.js; the Alpine container has no git).
      - name: rust toolchain
        run: |
          echo "TOOLCHAIN=$(node -p "require('./upstream.json').rust_toolchain")" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: system packages and rust
        if: ${{ !matrix.alpine }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q libzstd-dev
          else
            brew install zstd
          fi
          rustup toolchain install "$TOOLCHAIN" --profile minimal --target ${{ matrix.target }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ hashFiles('capi/Cargo.lock') }}

      - name: build
        if: ${{ !matrix.alpine }}
        env:
          CC: ${{ matrix.cc }}
          CFLAGS: ${{ matrix.cflags }}
          LDFLAGS: ${{ runner.os == 'macOS' && '-L/opt/homebrew/lib' || '' }}
        run: |
          node build.js --toolchain "$TOOLCHAIN" --target ${{ matrix.target }} ${{ !matrix.no-shared && '--shared --napi' || '' }} ${{ matrix.test && '--test' || '' }}

      # The property tests of our layer (test/fuzz, fast-check pinned by hash in its package-lock.json), against the
      # addon just built. Not on Intel macOS, which has no addon.
      - name: property tests
        if: ${{ !matrix.alpine && !matrix.no-shared }}
        env:
          TS_SEMA_NODE: ${{ github.workspace }}/dist/ts_sema.node
        run: |
          npm ci --prefix test/fuzz --ignore-scripts --no-audit --no-fund
          node --test test/fuzz/properties.test.js

      # Alpine 3.23 (lo's musl image base): linux-headers for mimalloc; zstd-dev and llvm-libunwind-dev for the test
      # (rustc's native-static-libs for the musl target are -lunwind -lc: LLVM's libunwind); their -static packages so
      # ts_sema.node links them in and needs nothing installed; rustup for the nightly.
      # The host's cargo registry is mounted, so actions/cache covers it too.
      - name: build (Alpine)
        if: ${{ matrix.alpine }}
        run: |
          mkdir -p ~/.cargo/registry
          docker run --rm -e TOOLCHAIN -e SOURCE_DATE_EPOCH -v "$PWD:/src" -v "$HOME/.cargo/registry:/root/.cargo/registry" -w /src \
            alpine:3.23 sh -euc '
              apk add --no-cache build-base linux-headers nodejs npm zstd-dev zstd-static llvm-libunwind-dev llvm-libunwind-static rustup
              rustup-init -y -q --profile minimal --default-toolchain "$TOOLCHAIN"
              . /root/.cargo/env
              CC=gcc node build.js --toolchain "$TOOLCHAIN" --target ${{ matrix.target }} --shared --napi --test
              npm ci --prefix test/fuzz --ignore-scripts --no-audit --no-fund
              TS_SEMA_NODE=/src/dist/ts_sema.node node --test test/fuzz/properties.test.js'

      # Plain ustar, no macOS metadata files: lo's lib/untar.js reads ustar headers only (no pax records). One top
      # directory, ts-sema-<target>/: lo's untar recreates (empties) an existing first directory, so never "./".
      # dist/debug/ (the split-off debug info: the archive as built, <file>.debug or <file>.dSYM for the shared library
      # and the addon) becomes its own asset, ts-sema-<target>-debug.tar.gz, and the SBOM is also an asset of its own,
      # ts-sema-<target>.cdx.json.
      - name: package
        env:
          COPYFILE_DISABLE: 1
          T: ts-sema-${{ matrix.target }}
        run: |
          mkdir -p package && cp -R dist "package/$T" && rm -rf "package/$T/debug"
          tar --format=ustar -czf "$T.tar.gz" -C package "$T"
          if [ -d dist/debug ]; then
            cp -R dist/debug "package/$T-debug"
            tar --format=ustar -czf "$T-debug.tar.gz" -C package "$T-debug"
          fi
          cp dist/sbom.cdx.json "$T.cdx.json"
          cat dist/build.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ts-sema-${{ matrix.target }}
          path: |
            ts-sema-${{ matrix.target }}.tar.gz
            ts-sema-${{ matrix.target }}-debug.tar.gz
            ts-sema-${{ matrix.target }}.cdx.json
          if-no-files-found: error
