# OpenSSF Scorecard (https://scorecard.dev): results to the Security tab (code scanning) and, with publish_results,
# to api.scorecard.dev for the README badge. The published results come with rules on this workflow: no top-level env
# or defaults, no workflow-level write permissions, id-token: write only in this job, an Ubuntu hosted runner, and
# only the actions below. Based on ossf/scorecard's own scorecard-analysis.yml.
name: scorecard
on:
  push:
    branches: [main]   # only the default branch is supported
  schedule:
    - cron: '30 1 * * 6' # weekly, Saturdays
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # upload to code scanning
      id-token: write        # publish_results: the OIDC token api.scorecard.dev checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard.sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
