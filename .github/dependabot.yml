# GitHub Actions and the release tools. Cargo stays out: the crate versions are Bun's (capi/Cargo.lock comes from Bun's lock via
# sync.js), so they move when we re-vendor a Bun commit, not one by one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  # The property tests' fast-check (test/fuzz).
  - package-ecosystem: npm
    directory: /test/fuzz
    schedule:
      interval: weekly
    commit-message:
      prefix: test
  # The release tools (npm, publint, attw) release.yml installs with npm ci.
  - package-ecosystem: npm
    directory: /release-tools
    schedule:
      interval: weekly
    groups:
      release-tools:
        patterns: ['*']
    commit-message:
      prefix: ci
