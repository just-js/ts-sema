# CodeQL (workflows/codeql.yml): our code only. vendor/ (Bun's crates, mimalloc, node-api-headers) is upstream's,
# unmodified, and codegen/ is generated by Bun's tools; target/, work/ and dist/ are build output. With build-mode
# none the Rust and C/C++ extractors still read the vendored crates to resolve types, but report nothing in them.
name: ts-sema
paths-ignore:
  - vendor
  - codegen
  - target
  - work
  - dist
